<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Bolo Code</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">BOLO</div>
      <div id="status" class="status">loading…</div>
    </header>
    <main id="log" class="log" aria-live="polite"></main>
    <div id="perm" class="perm" hidden>
      <div class="perm-card">
        <pre id="perm-text"></pre>
        <div class="perm-actions">
          <button type="button" id="perm-allow">Allow</button>
          <button type="button" id="perm-always">Always</button>
          <button type="button" id="perm-deny">Deny</button>
        </div>
      </div>
    </div>
    <footer class="input-bar">
      <input
        id="prompt"
        type="text"
        placeholder="Message or /help …"
        autocomplete="off"
      />
      <button id="send" type="button">Send</button>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
